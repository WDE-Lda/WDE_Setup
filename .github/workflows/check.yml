# Check padrao da WDE: corre em cada Pull Request e em cada push para main.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Only dev/v* merges into main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require a dev/vX.Y.Z branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev/v*) echo "Release branch: $HEAD_REF" ;;
            *) echo "::error::Only dev/vX.Y.Z branches may be merged into main (got '$HEAD_REF'). Change the base of this PR to the open dev/v branch."; exit 1 ;;
          esac
  powershell:
    name: PowerShell (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        # windows-latest ships PSScriptAnalyzer for both shells; Install-Module is slow on 5.1, so only when missing.
        run: |
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Get-Module PSScriptAnalyzer -ListAvailable | Format-Table Name, Version, Path -AutoSize
      - name: Analyze setup.ps1
        run: |
          # Interactive launcher: Write-Host is the intended output, and Update-SessionPath only refreshes this session's PATH.
          $findings = Invoke-ScriptAnalyzer -Path ./setup.ps1 -Severity Warning, Error `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $findings | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($findings) { throw "PSScriptAnalyzer: $(@($findings).Count) finding(s) in setup.ps1." }
